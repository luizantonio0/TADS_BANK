volumes:
  rabbitmq_data:
  redis_data:

networks:
  tadsbank:
  auth:
  cliente:
  conta:
  gerente:
  tads-network:

services:

  frontend-app:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: tadsbank-frontend
    ports:
      - "4200:80"
    
  gateway:
    build:
      context: ./back-end/API_Gateway
      dockerfile: Dockerfile
    depends_on:
      orquestrador:
        condition: service_healthy
      ms-auth:
        condition: service_healthy
      ms-cliente:
        condition: service_healthy
      ms-gerente:
        condition: service_healthy
      ms-conta:
        condition: service_healthy
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"
    networks:
      - tadsbank
    volumes:
      - ./back-end/API_Gateway:/usr/src/app
      - /usr/src/app/node_modules
    command: node --watch index.js

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tadsbank

  redis:
    image: redis:7.2-alpine
    container_name: tads-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5 
      start_period: 5s
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tadsbank
    command: ["redis-server", "--appendonly", "yes"]

  auth-ms-db:
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "mongosh", "--username", "admin", "--password", "password", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./init-db/setup.js:/docker-entrypoint-initdb.d/setup.js:ro,z
    networks:
      - auth
    ports:
      - "27017:27017"

  postgres:
    build: .
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cliente
      - conta
      - gerente
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d:z
    ports:
      - "5432:5432"
    command: >
      sh -c "dos2unix /docker-entrypoint-initdb.d/*.sh && exec docker-entrypoint.sh postgres"

  orquestrador:
    build:
      context: ./back-end/Orquestrador
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/localhost/8081'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    volumes:
      - ./back-end/Orquestrador:/app
    networks:
      - tadsbank

  ms-auth:
    build:
      context: ./back-end/MS_auth
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-ms-db:
        condition: service_healthy
    environment:
      JWT_SECRET: AYqQdMQcnW6JOCMyBS24A8GFbeRk4VTth6o8FlSDNIs
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/localhost/8055'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    ports:
      - "8055:8055"
    volumes:
      - ./back-end/MS_auth:/app
    networks:
      - auth
      - tadsbank

  ms-cliente:
    build:
      context: ./back-end/MS_cliente
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/localhost/4729'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    volumes:
      - ./back-end/MS_cliente:/app
    ports:
      - "4729:4729"
    networks:
      - cliente
      - tadsbank

  ms-gerente:
    build:
      context: ./back-end/MS_gerente
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/localhost/2563'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    volumes:
      - ./back-end/MS_gerente:/app
    ports:
      - "2563:2563" 
    networks:
      - gerente
      - tadsbank

  ms-conta:
    build:
      context: ./back-end/MS_conta
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ms_contas
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_RABBITMQ_HOST=rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/localhost/4873'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    volumes:
      - ./back-end/MS_conta:/app  
    networks:
      - conta
      - tadsbank
    ports:
      - "4873:4873"
    
