<p class="text-2xl font-bold text-primary mb-4">Seus clientes:</p>
<div>
    <div class="mb-2">
        <button class="flex gap-x-2" (click)="filtrando = true">
            <span class="material-symbols-outlined">filter_alt</span>
            <p>Filtrar</p>
        </button>
    </div>
    @if(nomeCliente != '') {
        <div class="w-full bg-yellow-100 text-center border border-yellow-200 rounded-md text-indigo-900 mb-2 py-2">
            Consulta realizada usando o filtro de pesquisa! <span (click)="onFiltered('')" class="text-blue-500 cursor-pointer underline">Limpar filtros</span> 
        </div>
    }
    <data-grid #gridClientes [columns]="colunas" [supplier]="loadClientes.bind(this)">
        <ng-template #desktopRow let-item>
            <td>{{ item.cpf | cpf }}</td>
            <td>{{ item.nome }}</td>
            <td>{{ item.cidade }}, {{item.estado}}</td>
            <td>
                <div
                    [ngClass]="{
                        'bg-green-100 border-green-400 border': item.saldo >= 0,
                        'bg-red-100 border-red-400 border': item.saldo < 0
                    }"
                    class="bg-green-400 px-2 py-1 rounded-lg w-fit">
                    {{ item.saldo | currency: 'BRL' }}
                </div>
            </td>
            <td>{{ item.limite | currency: 'BRL' }}</td>
            <td class="flex gap-x-2 [&>button]:text-xs! [&>button]:h-auto! ">
                <button class="my-auto items-center flex justify-center gap-x-0.5">
                    <span class="material-symbols-outlined text-sm!">search</span>
                    Consultar
                </button>
            </td>
        </ng-template>
    </data-grid>
</div>

<modal-filtrar-cliente [control]="filtrando" (close)="filtrando = false" (filtered)="onFiltered($event)" />
