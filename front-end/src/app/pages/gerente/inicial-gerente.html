<div class="h-main-screen py-4">
    <div class="flex gap-x-6">
        <div class="flex flex-col gap-y-3 w-52 flex-none">
            <button class="h-16 flex items-center justify-start px-6 gap-x-3 text-sm font-bold transition-all duration-300 rounded-2xl border"
                (click)="selectedTab = 1"
                [ngClass]="selectedTab == 1 ? 'bg-primary text-white border-primary shadow-lg shadow-primary/20 scale-[1.02]' : 'bg-white text-slate-500 border-slate-200 hover:border-primary/50 hover:bg-slate-50'">
                <span class="material-symbols-outlined" [class.fill-1]="selectedTab == 1">pending_actions</span>
                <span>Solicitações Abertas</span>
            </button>

            <button class="h-16 flex items-center justify-start px-6 gap-x-3 text-sm font-bold transition-all duration-300 rounded-2xl border"
                (click)="selectedTab = 2"
                [ngClass]="selectedTab == 2 ? 'bg-primary text-white border-primary shadow-lg shadow-primary/20 scale-[1.02]' : 'bg-white text-slate-500 border-slate-200 hover:border-primary/50 hover:bg-slate-50'">
                <span class="material-symbols-outlined" [class.fill-1]="selectedTab == 2">group</span>
                <span>Visualizar Clientes</span>
            </button>

            <button class="h-16 flex items-center justify-start px-6 gap-x-3 text-sm font-bold transition-all duration-300 rounded-2xl border"
                (click)="selectedTab = 3"
                [ngClass]="selectedTab == 3 ? 'bg-primary text-white border-primary shadow-lg shadow-primary/20 scale-[1.02]' : 'bg-white text-slate-500 border-slate-200 hover:border-primary/50 hover:bg-slate-50'">
                <span class="material-symbols-outlined" [class.fill-1]="selectedTab == 3">stars</span>
                <span>Melhores Clientes</span>
            </button>

            <button class="h-16 flex items-center justify-start px-6 gap-x-3 text-sm font-bold transition-all duration-300 rounded-2xl border"
                (click)="selectedTab = 4"
                [ngClass]="selectedTab == 4 ? 'bg-primary text-white border-primary shadow-lg shadow-primary/20 scale-[1.02]' : 'bg-white text-slate-500 border-slate-200 hover:border-primary/50 hover:bg-slate-50'">
                <span class="material-symbols-outlined" [class.fill-1]="selectedTab == 4">person_search</span>
                <span>Consultar Cliente</span>
            </button>
        </div>

        <div class="flex-1 bg-white/50 backdrop-blur-sm rounded-3xl border border-slate-200/60 p-6 min-h-[calc(100vh-120px)] shadow-sm">
            @if(selectedTab == 1) {
                <tab-solicitacoes></tab-solicitacoes>
            }
            @if(selectedTab == 2) {
                <tab-clientes (consultar)="irParaConsulta($any($event))"></tab-clientes>
            }
            @if(selectedTab == 3) {
                <tab-melhores-clientes (consultar)="irParaConsulta($any($event))"></tab-melhores-clientes>
            }
            @if(selectedTab == 4) {
                <tab-consultar-cliente [cpfInicial]="cpfParaConsulta"></tab-consultar-cliente>
            }
        </div>
    </div>
</div>
