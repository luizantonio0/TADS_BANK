<div class="bg-white rounded-lg shadow p-4">
  <h2 class="text-2xl font-bold text-primary mb-4 flex items-center gap-2">
    <span class="material-symbols-outlined">group</span>
    Listagem de Gerentes
  </h2>

  <button (click)="exibirModalAdicionar=true" class="bg-green-500 flex items-center justify-center gap-x-2 text-lg font-medium transition-colors mb-4">
    <span class="material-symbols-outlined">add</span>
    <span>Adicionar Gerente ou Administrador</span>
  </button>

  <data-grid #gridGerentes [columns]="columns" [supplier]="carregarGerentes.bind(this)">
    <ng-template #desktopRow let-item>
      <td>{{ item.nome }}</td>
      <td>{{ item.cpf | cpf }}</td>
      <td>{{ item.email }}</td>
      <td>{{ item.telefone | telefone }}</td>
      <td>
        <div class="flex [&>span]:cursor-pointer [&>span]:text-indigo gap-x-1">
          <span class="material-symbols-outlined" (click)="openEdit(item)">edit</span>
          <span class="material-symbols-outlined" (click)="openDelete(item)">delete</span>
        </div>
      </td>
    </ng-template>
  </data-grid>
</div>

<app-modal-editar-gerente [gerente]="gerente!" [control]="exibirModalEditar" (close)="closeCallback()" (submited)="submitEdit($event)"/>
<app-modal-excluir-gerente [control]="exibirModalExcluir" (close)="closeCallback()" (submited)="submitDelete()"/>
<app-modal-adicionar-gerente [control]="exibirModalAdicionar" (close)="closeCallback()" (submited)="submitCreate($event)"/>
