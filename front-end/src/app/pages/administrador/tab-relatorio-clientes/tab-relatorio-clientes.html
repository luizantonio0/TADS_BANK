<div class="bg-white rounded-lg shadow p-4">
  <h2 class="text-2xl font-bold text-primary mb-4 flex items-center gap-2">
    <span class="material-symbols-outlined">description</span>
    Relatório Geral de Clientes
  </h2>
  <div>
    <data-grid [columns]="columns" [supplier]="carregarGerentes.bind(this)">
      <ng-template #desktopRow let-item>
        <td>{{ item.cpf | cpf }}</td>
        <td>{{ item.nome }}</td>
        <td>{{ item.email }}</td>
        <td>{{ item.conta }}</td>
        <td>{{ item.salario | currency: 'BRL' }}</td>
        <td>
          <div [ngClass]="{
                        'bg-green-100 border-green-400': item.saldo > 0,
                        'bg-red-100 border-red-400': item.saldo <= 0
                    }" class="px-2 py-1 rounded-lg w-fit border">
            {{ item.saldo | currency: 'BRL'}}
        </div>
        </td>
        <td>{{ item.limite | currency: 'BRL' }}</td>
        <td>{{ item.gerente_nome }}</td>
        <td>{{ item.gerente | cpf }}</td>
      </ng-template>
    </data-grid>
  </div>
</div>
