<modal [control]="control" title="Editar Gerente" icon="manage_accounts" submitText="Salvar Alterações"
  [submitCallback]="submit" (close)="onClose()">

  <form [formGroup]="formCadastro">
    <div class="grid grid-cols-5 gap-4 min-w-75 max-w-75 md:min-w-112.5">
      <div class="flex flex-col gap-1 col-span-full">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-gray-500 text-[20px]">person</span>
          <label class="text-sm font-semibold text-gray-700">Nome Completo</label>
        </div>
        <input type="text"
          formControlName="nome" 
          class="w-full border border-gray-300 rounded-md py-3 px-4 focus:outline-none focus:ring-2 focus:ring-primary/50"
          placeholder="Digite o nome do gerente">
      </div>

      <div class="flex flex-col gap-1 col-span-3">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-gray-500 text-[20px]">mail</span>
          <label class="text-sm font-semibold text-gray-700">E-mail</label>
        </div>
        <input type="email"
          formControlName="email"
          class="w-full border border-gray-300 rounded-md py-3 px-4 focus:outline-none focus:ring-2 focus:ring-primary/50"
          placeholder="gerente@bantads.com.br">
      </div>

      <div class="flex flex-col gap-1 col-span-2">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-gray-500 text-[20px]">phone</span>
          <label class="text-sm font-semibold text-gray-700">Telefone</label>
        </div>
        <input type="telefone"
          formControlName="telefone"
          mask="(00) 00000-0000" [dropSpecialCharacters]="true"
          class="w-full border border-gray-300 rounded-md py-3 px-4 focus:outline-none focus:ring-2 focus:ring-primary/50"
          placeholder="00 00000-0000">
      </div>

      <div class="flex flex-col gap-1 col-span-full">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-gray-500 text-[20px]">lock</span>
          <label class="text-sm font-semibold text-gray-700">Nova Senha</label>
        </div>
        <input type="password"
          formControlName="senha"
          class="w-full border border-gray-300 rounded-md py-3 px-4 focus:outline-none focus:ring-2 focus:ring-primary/50"
          placeholder="Deixe em branco para manter a atual">
      </div>
    </div>
  </form>
</modal>
