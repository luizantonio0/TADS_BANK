server:
  port: 4873

spring:
  application:
    name: conta
  data:
    redis:
      host: redis
      port: 6379
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5s
    template:
      reply-timeout: 30
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    write:
      jdbc-url: jdbc:postgresql://postgres:5432/ms_conta_write
      username: admin
      password: password
      driver-class-name: org.postgresql.Driver
    read:
      jdbc-url: jdbc:postgresql://postgres:5432/ms_conta_read
      username: admin
      password: password
      driver-class-name: org.postgresql.Driver
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE