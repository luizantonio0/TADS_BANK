server:
  port: 2563

spring:
  application:
    name: gerente
  data:
    redis:
      host: redis
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5s
    template:
      reply-timeout: 30
  datasource:
    url: jdbc:postgresql://postgres:5432/ms_gerente
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver #
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.bantads.gerente: DEBUG