server:
  port: 4729

spring:
  application:
    name: cliente
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ms_cliente
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver #
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5s
    template:
      reply-timeout: 1000000
logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

mail:
  username: ${GMAIL_USERNAME}
  password: ${GMAIL_PASSWORD}